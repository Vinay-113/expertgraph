name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scikit-learn networkx matplotlib pytest
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts
      - run: node --check ui/app.js && node --check docs/demo/demo.js
      - run: python scripts/check_public_demo.py
