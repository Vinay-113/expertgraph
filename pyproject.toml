[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expertgraph"
version = "0.1.0"
description = "Evidence-preserving multi-expert retrieval for software incident reports"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "networkx>=3.2,<4",
  "sentence-transformers>=3,<6",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
expertgraph = "expertgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
